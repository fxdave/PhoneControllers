# Builds the AppImage. A pushed v* tag attaches it to that tag's GitHub release (created if
# missing); other runs keep it as a workflow artifact.
name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Install the packaging tools
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd

      - name: Install dependencies
        run: /bin/sh ./appimage/get-dependencies.sh

      - name: Build the AppImage
        shell: bash
        env:
          # The tag's version for a release, otherwise the commit; git describe isn't reliable
          # in the container.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set -o pipefail
          if ! /bin/sh ./appimage/make-appimage.sh 2>&1 | tee build.log; then
            # Show the end of the log as an annotation, which the run's summary page shows.
            echo "::error title=AppImage build failed::$(tail -n 60 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist/*.AppImage*

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: AppImage-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
